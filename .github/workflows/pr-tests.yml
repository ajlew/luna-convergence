name: Luna PR regression tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Unified period and voice regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out PR code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run Luna regression tests
        run: python -m pytest -q tests test_plain_workflow.py test_weekly_view_v329.py
