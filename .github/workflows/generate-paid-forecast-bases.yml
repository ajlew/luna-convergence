name: Generate paid forecast calculation bases
run-name: Paid forecast bases · ${{ inputs.product || 'scheduled' }} · ${{ inputs.date || 'automatic period' }}

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-paid-forecast-bases.yml'
      - 'scripts/generate_paid_forecast_bases.py'
      - 'yearly_prebuilt_base.py'
  schedule:
    # 25th of each month: prepare all 12 Paid Monthly sign bases for next month.
    - cron: '30 10 25 * *'
    # 00:30 AEST / 01:30 AEDT: ensure the current month's 12 Yearly horizons exist.
    - cron: '30 14 * * *'
  workflow_dispatch:
    inputs:
      product:
        description: Calculation base to build
        required: true
        type: choice
        options: [monthly, yearly]
        default: yearly
      date:
        description: Monthly = target month; Yearly = any date in target start month
        required: false
        type: string
      sign:
        description: Optional single sign; blank builds all twelve
        required: false
        type: string
      timezone:
        description: IANA timezone used by the calculation base
        required: false
        default: Australia/Sydney
        type: string
      city:
        description: Representative city used by the shared solar layer
        required: false
        default: Sydney
        type: string
      force:
        description: Rewrite an existing Yearly horizon
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: luna-paid-forecast-bases
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install existing app dependencies
        run: python -m pip install -r requirements.txt

      - name: Build deterministic bases
        shell: bash
        env:
          REQUEST_PRODUCT: ${{ inputs.product }}
          REQUEST_DATE: ${{ inputs.date }}
          REQUEST_SIGN: ${{ inputs.sign }}
          REQUEST_TIMEZONE: ${{ inputs.timezone }}
          REQUEST_CITY: ${{ inputs.city }}
          REQUEST_FORCE: ${{ inputs.force }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          product="$REQUEST_PRODUCT"
          timezone="$REQUEST_TIMEZONE"
          city="$REQUEST_CITY"

          if [ -z "$timezone" ]; then timezone="Australia/Sydney"; fi
          if [ -z "$city" ]; then city="Sydney"; fi

          if [ -z "$product" ]; then
            case "$SCHEDULE" in
              '30 10 25 * *') product=monthly ;;
              '30 14 * * *') product=yearly ;;
              *) product=yearly ;;
            esac
          fi

          args=(--product "$product" --timezone "$timezone" --city "$city")
          if [ -n "$REQUEST_DATE" ]; then args+=(--date "$REQUEST_DATE"); fi
          if [ -n "$REQUEST_SIGN" ]; then args+=(--sign "$REQUEST_SIGN"); fi
          if [ "$REQUEST_FORCE" = "true" ]; then args+=(--force); fi

          python scripts/generate_paid_forecast_bases.py "${args[@]}"

      - name: Commit bases
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- generated/paid_forecast_bases
          if git diff --cached --quiet; then
            echo "No base changes to commit."
            exit 0
          fi
          git commit -m 'Generate paid forecast calculation bases'
          git pull --rebase
          git push
