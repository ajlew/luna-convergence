name: Generate Luna plain-text readings
run-name: Luna ${{ inputs.product || 'scheduled' }} · ${{ inputs.date || 'Sydney current period' }} · ${{ inputs.sign || 'all signs' }}
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-plain-readings.yml'
      - 'scripts/generate_plain_readings.py'
      - 'plain_readings.py'
      - 'plain_voice_generator.py'
      - 'reading_quality.py'
      - 'reading_facts.py'
      - 'studio_readings.py'
  schedule:
    # 20:00 AEST / 21:00 AEDT: prepare tomorrow before Sydney midnight.
    - cron: '0 10 * * *'
    # Morning Sydney catch-up for any incomplete current-day readings.
    - cron: '0 20 * * *'
    # Saturday evening Sydney: prepare the coming Monday's week.
    - cron: '0 11 * * 6'
    # The 25th in Sydney: prepare next month.
    - cron: '0 10 25 * *'
  workflow_dispatch:
    inputs:
      product:
        description: all = Daily, 1h pause, Weekly, 1h pause, Monthly, 1h pause, Studio
        required: true
        type: choice
        options: [all, daily, weekly, monthly, studio]
      date:
        description: Target date YYYY-MM-DD; blank uses today in Sydney
        required: false
        type: string
      sign:
        description: Optional sign to retry; blank generates all twelve
        required: false
        type: string
      refresh:
        description: Rewrite selected readings even if current (uses additional LLM calls)
        required: false
        type: boolean
        default: false
      check_only:
        description: Check completeness only; no generation charges
        required: false
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: luna-plain-reading-writer
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing app dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate independent sign readings
        env:
          LUNA_VOICE_BASE_URL: ${{ secrets.LUNA_VOICE_BASE_URL || vars.LUNA_VOICE_BASE_URL }}
          LUNA_VOICE_MODEL: ${{ secrets.LUNA_VOICE_MODEL || vars.LUNA_VOICE_MODEL }}
          LUNA_VOICE_API_KEY: ${{ secrets.LUNA_VOICE_API_KEY }}
          REQUEST_PRODUCT: ${{ inputs.product }}
          REQUEST_DATE: ${{ inputs.date }}
          REQUEST_SIGN: ${{ inputs.sign }}
          REQUEST_REFRESH: ${{ inputs.refresh }}
          CHECK_ONLY: ${{ inputs.check_only }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        shell: bash
        run: |
          product="$REQUEST_PRODUCT"
          if [ -z "$product" ]; then
            case "$SCHEDULE" in
              '0 11 * * 6') product=weekly ;;
              '0 10 25 * *') product=monthly ;;
              '0 20 * * *') product=maintain ;;
              *) product=daily ;;
            esac
          fi
          # Manual blank dates mean today, never an accidental future date.
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -z "$REQUEST_DATE" ]; then
            REQUEST_DATE=$(python -c 'from datetime import datetime; from zoneinfo import ZoneInfo; print(datetime.now(ZoneInfo("Australia/Sydney")).date())')
          fi
          common_args=()
          if [ "$REQUEST_REFRESH" = "true" ]; then common_args+=(--refresh); fi
          if [ "$CHECK_ONLY" = "true" ]; then common_args+=(--check-only); fi
          if [ -n "$REQUEST_DATE" ]; then common_args+=(--date "$REQUEST_DATE"); fi
          if [ -n "$REQUEST_SIGN" ]; then common_args+=(--sign "$REQUEST_SIGN"); fi
          result=0

          run_product() {
            local stage_result=0
            python scripts/generate_plain_readings.py --product "$1" "${common_args[@]}" || stage_result=$?
            if [ "$stage_result" -gt "$result" ]; then result=$stage_result; fi
          }

          pause_one_hour() {
            if [ "$CHECK_ONLY" != "true" ]; then
              echo "Pausing one hour before the next product to protect the provider limit."
              sleep 3600
            fi
          }

          if [ "$product" = "all" ]; then
            run_product daily
            pause_one_hour
            run_product weekly
            pause_one_hour
            run_product monthly
            pause_one_hour
            run_product studio
          else
            run_product "$product"
          fi

          if [ "$EVENT_NAME" = "schedule" ] && [ "$product" = "weekly" ]; then
            pause_one_hour
            run_product studio
          fi
          exit "$result"
      - name: Save completed signs even if another sign failed
        if: always()
        shell: bash
        run: |
          if [ ! -d generated/readings ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- generated/readings
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish Luna plain-text readings'
          git pull --rebase
          git push
